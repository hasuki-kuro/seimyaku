<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星巡りの剣 - MENU</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    /* 2枚目画像のような、鮮やかで深みのあるブルーのグラデーション */
    background: radial-gradient(circle at center, #0099ff 0%, #0055cc 70%, #0033aa 100%);
    color: #ffffff;
    font-family: "游明朝", YuMincho, "Hiragino Mincho ProN", serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow-x: hidden;
}

/* 背景にうっすらとキャラクターやグラフィックを入れるための装飾（オプション） */
body::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    /* ここに背景キャラクターの画像URLを入れられます */
    /* background: url('character-silhouette.png') no-repeat center/cover; */
    opacity: 0.15; /* うっすら見える程度に透過 */
    z-index: 1;
    pointer-events: none;
}

/* メニュー全体のコンテナ */
.menu-container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 600px;
    padding: 40px 20px;
    text-align: center;
}

/* 右上のCLOSEボタン */
.close-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, 0.4);
    padding: 8px 12px;
    transition: 0.3s;
    text-transform: uppercase;
}
.close-btn:hover {
    color: #fff;
    border-color: #fff;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

/* 上部のロゴ・タイトルエリア */
.menu-header {
    margin-bottom: 40px;
}
.menu-logo {
    font-size: 2.2rem;
    letter-spacing: 0.2em;
    font-weight: bold;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    margin-bottom: 5px;
}
.menu-sub {
    font-size: 0.75rem;
    letter-spacing: 0.4em;
    color: rgba(255, 255, 255, 0.6);
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    padding-bottom: 20px;
    display: inline-block;
    width: 80%;
}

/* SEASON 1 などのシリーズ切り替えタグ */
.season-tag {
    font-size: 1.4rem;
    letter-spacing: 0.1em;
    margin: 20px 0;
    color: rgba(255, 255, 255, 0.9);
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    padding-bottom: 10px;
}

/* 2列に並ぶメニューグリッド */
.menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr; /* 綺麗に2分割 */
    gap: 25px 40px; /* 縦と横の隙間 */
    padding: 20px 0;
}

/* メニューの各項目 */
.menu-item {
    color: rgba(255, 255, 255, 0.8);
    font-size: 1.3rem;
    letter-spacing: 0.15em;
    text-decoration: none;
    font-weight: 500;
    transition: 0.3s ease;
    text-transform: uppercase;
    position: relative;
    display: inline-block;
}

/* 画像にあった「現在のページ（TOP）」の剣マークのようなエフェクトの再現 */
.menu-item.active {
    color: #fffb14; /* 画像の『TOP ➔』のような黄色・ゴールド系のアクセント */
    text-shadow: 0 0 10px rgba(255, 251, 20, 0.6);
}
.menu-item.active::after {
    content: " ➔";
    font-size: 1rem;
    vertical-align: middle;
}

/* 通常項目のホバー効果 */
.menu-item:not(.active):hover {
    color: #ffffff;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
    transform: scale(1.05);
}

/* 下部のオフィシャル表記 */
.menu-footer {
    margin-top: 50px;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    color: rgba(255, 255, 255, 0.5);
    text-transform: uppercase;
}
</style>
</head>
<body>

<a href="#" class="close-btn">✕ CLOSE</a>

<div class="menu-container">
    
    <div class="menu-header">
        <h1 class="menu-logo">星巡りの剣</h1>
        <p class="menu-sub">Wand and Sword</p>
    </div>

    <div class="season-tag">SEASON 1</div>

    <nav class="menu-grid">
        <a href="#" class="menu-item active">TOP</a>
        <a href="#story" class="menu-item">STORY</a>
        
        <a href="#" class="menu-item">NEWS</a>
        <a href="#" class="menu-item">EPISODES</a>
        
        <a href="#" class="menu-item">CHARACTER</a>
        <a href="#" class="menu-item">WORLD</a>
        
        <a href="#" class="menu-item">MOVIE</a>
        <a href="#" class="menu-item">MUSIC</a>
        
        <a href="#" class="menu-item">BOOKS</a>
        <a href="#" class="menu-item">GOODS</a>
    </nav>

    <div class="menu-footer">
        Official Website
    </div>
</div>

</body>
</html>
