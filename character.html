<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHARACTER | 星脈と位相の狭間で</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; min-height:100%; background:#050810; color:#c8d8f0; }
    body { display:flex; flex-direction:column; font-family:"Montserrat",sans-serif; min-height:100vh; }
    #starCanvas { position:fixed; inset:0; z-index:0; }
    .vignette { position:fixed; inset:0; z-index:1; pointer-events:none; background:radial-gradient(ellipse 70% 60% at 50% 45%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 35%, rgba(3,6,14,0.55) 100%); }

    /* header */
    header { position:relative; z-index:20; display:flex; justify-content:center; align-items:center; padding:36px 32px 24px; flex-shrink:0; }
    .site-title-link { text-decoration:none; display:block; }
    .site-title { font-family:"Noto Serif JP",serif; font-weight:200; font-size:clamp(20px,4.5vw,42px); letter-spacing:0.22em; text-align:center; background:linear-gradient(100deg,#b8ccee 0%,#d4a843 45%,#b8ccee 100%); background-size:220% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:shimmer 8s linear infinite; transition:opacity 0.3s; }
    .site-title:hover { opacity:0.7; }
    @keyframes shimmer { 0%{background-position:0% center} 100%{background-position:220% center} }

    /* hamburger */
    .menu-btn { background:none; border:none; cursor:pointer; padding:6px; display:flex; flex-direction:column; gap:6px; z-index:110; position:absolute; top:36px; right:32px; }
    .menu-btn span { display:block; width:22px; height:1px; background:#c8d8f0; transition:transform 0.35s ease,opacity 0.35s ease; transform-origin:center; }
    .menu-btn.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
    .menu-btn.open span:nth-child(2) { opacity:0; transform:scaleX(0); }
    .menu-btn.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }

    /* overlay */
    .menu-overlay { position:fixed; inset:0; z-index:100; background:rgba(5,8,16,0.96); backdrop-filter:blur(16px); display:flex; flex-direction:column; justify-content:center; align-items:center; gap:52px; opacity:0; pointer-events:none; transition:opacity 0.4s ease; }
    .menu-overlay.open { opacity:1; pointer-events:auto; }
    .menu-overlay nav { display:flex; flex-direction:column; align-items:center; gap:36px; }
    .menu-overlay nav a { color:#5a6e90; text-decoration:none; font-family:"Montserrat",sans-serif; font-weight:200; font-size:clamp(22px,5.5vw,42px); letter-spacing:0.35em; transition:color 0.3s ease,letter-spacing 0.35s ease; }
    .menu-overlay nav a:hover { color:#d4a843; letter-spacing:0.5em; }
    .menu-close-btn { position:absolute; bottom:48px; left:50%; transform:translateX(-50%); background:none; border:1px solid rgba(200,216,240,0.2); color:#5a6e90; font-family:"Montserrat",sans-serif; font-weight:200; font-size:11px; letter-spacing:0.4em; padding:10px 28px; cursor:pointer; border-radius:2px; transition:color 0.3s ease,border-color 0.3s ease; }
    .menu-close-btn:hover { color:#c8d8f0; border-color:rgba(200,216,240,0.5); }

    /* main */
    main { position:relative; z-index:10; flex:1; width:100%; max-width:640px; margin:0 auto; padding:8px 24px 64px; }

    /* ── タイトル ── */
    .page-label {
      font-family:"Montserrat",sans-serif; font-weight:200;
      font-size:clamp(22px,5vw,40px); letter-spacing:0.45em;
      color:#3a5478; text-align:center; padding-left:0.45em;
      margin-bottom:22px;
    }

    /* ── 〜編タブ ── */
    .arc-tabs { display:flex; justify-content:center; gap:28px; margin-bottom:22px; flex-wrap:wrap; }
    .arc-btn {
      background:none; border:none; cursor:pointer;
      font-family:"Noto Serif JP",serif; font-weight:300;
      font-size:clamp(14px,1.9vw,16px); letter-spacing:0.3em;
      color:#4a6080; padding:4px 0 8px 0.3em;
      border-bottom:1px solid transparent;
      transition:color 0.25s, border-color 0.25s;
    }
    .arc-btn:hover { color:#9abcd4; }
    .arc-btn.active { color:#9abcd4; border-bottom-color:rgba(212,168,67,0.55); }

    /* ── 五十音（横並び・はみ出したら横スクロール） ── */
    .kana-filter {
      display:flex; flex-wrap:nowrap; gap:6px;
      overflow-x:auto; scrollbar-width:none;
      padding:2px 2px 6px; margin-bottom:18px;
      justify-content:safe center;
    }
    .kana-filter::-webkit-scrollbar { display:none; }
    .kana-btn {
      flex:0 0 auto;
      background:none;
      border:1px solid rgba(200,216,240,0.12);
      color:#5a7090;
      font-family:"Noto Serif JP",serif; font-weight:300;
      font-size:13px; letter-spacing:0.05em;
      min-width:38px; padding:5px 8px; border-radius:2px; cursor:pointer;
      transition:color 0.25s, border-color 0.25s, background 0.25s;
    }
    .kana-btn:hover:not(:disabled) { color:#c8d8f0; border-color:rgba(200,216,240,0.3); }
    .kana-btn.active { color:#d4a843; border-color:rgba(212,168,67,0.5); background:rgba(212,168,67,0.06); }
    .kana-btn:disabled { color:#26344c; border-color:rgba(200,216,240,0.05); cursor:default; }

    /* ── 罫線 ── */
    .section-divider { display:flex; align-items:center; gap:12px; width:100%; margin:0 auto 18px; }
    .section-divider::before, .section-divider::after {
      content:""; flex:1; height:1px;
      background:linear-gradient(90deg,transparent,rgba(200,216,240,0.22),transparent);
    }
    .section-divider span { color:#d4a843; font-size:9px; opacity:0.6; }

    /* ── キャラクター一覧 ── */
    .char-list { list-style:none; }
    .char-item { border-bottom:1px solid rgba(200,216,240,0.06); }
    .char-item.pinned-last { border-bottom-color:rgba(212,168,67,0.18); margin-bottom:6px; }
    .char-item[hidden] { display:none; }

    .char-toggle {
      width:100%; display:flex; align-items:center; gap:16px;
      background:none; border:none; cursor:pointer; text-align:left;
      padding:15px 4px; color:#c8d8f0;
    }
    .char-arrow {
      flex:0 0 auto; width:14px; color:#d4a843; opacity:0.7;
      font-size:13px; line-height:1;
      transition:transform 0.3s ease, opacity 0.3s ease;
    }
    .char-name {
      font-family:"Noto Serif JP",serif; font-weight:300;
      font-size:clamp(16px,2.4vw,19px); letter-spacing:0.18em;
      transition:color 0.25s;
    }
    .char-toggle:hover .char-name { color:#e6eefa; }
    .char-toggle[aria-expanded="true"] .char-arrow { transform:rotate(90deg); opacity:1; }
    .char-toggle[aria-expanded="true"] .char-name { color:#d4a843; }

    .char-body {
      display:grid; grid-template-rows:0fr;
      transition:grid-template-rows 0.35s ease;
    }
    .char-body.open { grid-template-rows:1fr; }
    .char-body > div { overflow:hidden; }
    .char-desc {
      font-family:"Noto Serif JP",serif; font-weight:300;
      font-size:13.5px; line-height:2.1; letter-spacing:0.06em;
      color:#8aafc8; padding:0 4px 20px 34px;
    }

    .empty-note {
      font-family:"Noto Serif JP",serif; font-weight:300; font-size:13px;
      color:#4a6080; text-align:center; padding:28px 0;
    }

    button:focus-visible { outline:1px solid rgba(212,168,67,0.7); outline-offset:3px; }

    footer { position:relative; z-index:10; text-align:center; padding:10px 0 16px; font-size:11px; letter-spacing:0.22em; color:#7a9ab8; font-weight:300; flex-shrink:0; }

    @media (max-width:480px) {
      header { padding:28px 56px 20px; }
      .menu-btn { top:28px; right:18px; }
      main { padding:4px 18px 48px; }
      .kana-filter { gap:4px; }
      .kana-btn { flex:1 1 0; min-width:0; padding:6px 0; font-size:12px; }
    }
    @media (prefers-reduced-motion:reduce) {
      .site-title { animation:none; }
      .char-body, .char-arrow { transition:none; }
    }
  </style>
</head>
<body>
  <canvas id="starCanvas"></canvas>
  <div class="vignette"></div>
  <header>
    <a href="index.html" class="site-title-link">
      <h1 class="site-title">星脈と位相の狭間で</h1>
    </a>
    <button class="menu-btn" id="menuBtn" aria-label="メニューを開く">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="menu-overlay" id="menuOverlay">
    <nav>
      <a href="story.html">STORY</a>
      <a href="episodes.html">EPISODES</a>
      <a href="character.html">CHARACTER</a>
      <a href="map.html">MAP</a>
      <a href="word.html">WORD</a>
    </nav>
    <button class="menu-close-btn" id="menuCloseBtn">CLOSE</button>
  </div>

  <main>
    <h2 class="page-label">CHARACTER</h2>
    <div class="arc-tabs" id="arcTabs"></div>
    <div class="kana-filter" id="kanaFilter"></div>
    <div class="section-divider"><span>✦</span></div>
    <ul class="char-list" id="charList"></ul>
    <p class="empty-note" id="emptyNote" hidden>この行のキャラクターはまだいません</p>
  </main>

  <footer>@hasuki_kuro</footer>

  <script>
    /* ===== データ =====
       キャラを増やすときは CHARACTERS に1行足すだけでOK。
       kana  … 並び順と五十音の振り分けに使う読み（カタカナ）
       pin   … 先頭固定の順番（ソラ=1, リゼア=2）。それ以外は書かない
       arc   … ARCS の id                                         */
    const ARCS = [
      { id:"alesis", name:"アレシス編" },
    ];

    const CHARACTERS = [
      { arc:"alesis", pin:1, name:"ソラ", kana:"ソラ",
        desc:"ある日見つけた「何か」を知るため、剣一本を手に世界の真実を求めてアレシスへと踏み出した。不器用でも真っすぐな瞳が、出会う者の心を動かしていく。" },
      { arc:"alesis", pin:2, name:"リゼア", kana:"リゼア",
        desc:"ソラが旅立つのを前に、彼女もついて行くことを決意した。静かな瞳の奥に、何を想うのかは誰もわからない。" },
      { arc:"alesis", name:"アスカ", kana:"アスカ",
        desc:"アレシス武術学院3年生にして、学院随一の秀才。自らの意志でソラの師匠となる。仲の良くない者には言葉の節々にトゲがあり冷たい人間だと思われることもあるが、気の知れた人間には優しくお節介な面もある。" },
      { arc:"alesis", name:"アッシュ", kana:"アッシュ",
        desc:"アレシスへ向かう道中、窮地のソラとリゼアの前に現れた謎の男性。盗賊を退け、言葉を残し、アクセサリーを手渡してその場を去った。謎多き男性。" },
      { arc:"alesis", name:"エルダー", kana:"エルダー",
        desc:"ソラたちと同じ途中入学組の武術科1年生。アレシス道場の出身で、場を沸かせる賑やかさを持ち、天然さと裏表のない性格でぐいぐいと距離を縮めてくる、コミュ力おばけ。" },
      { arc:"alesis", name:"シャルド", kana:"シャルド",
        desc:"飄々とした風貌に本性を隠す男性。ソラとリゼアにアレシス武術学院への入学を勧めた張本人であり、学院内でそれなりの立場に就いているらしい。何を考えているのか、表情からは読めない。" },
      { arc:"alesis", name:"ちゃちゃ丸", kana:"チャチャマル",
        desc:"猫カフェ「にゃごすちん」が誇る人気の黒猫。ネロ命名の「ちゃちゃ丸」という名に本人（猫）は無頓着。会話の間隙を縫って割り込んでくるタイミングは、もはや神がかっている。" },
      { arc:"alesis", name:"ネロ", kana:"ネロ",
        desc:"「にゃごすちん」を営む中年男性。ミオの父。温厚で穏やかな人柄に誰もが安心するが、ふとした瞬間に浮かぶ冷ややかな笑顔には誰もが恐怖を覚える。" },
      { arc:"alesis", name:"ミオ", kana:"ミオ",
        desc:"猫カフェ「にゃごすちん」で働く、ソラたちと同年代の少女。誰とでもすぐに打ち解ける天真爛漫さを持つ一方、気づけば騒動の中心にいることも少なくない。" },
      { arc:"alesis", name:"ローライト", kana:"ローライト",
        desc:"ソラたちと同じ途中入学組の同級生でアレシスの名門家系。迅の剣を操る実力者でありながら、その立ち振る舞いはどこか陰を帯びている。ソラたちのことを「下賎な村の人間」と呼び、敵対視している。" },
    ];

    /* ===== 五十音の行 ===== */
    const ROWS = [
      { key:"ア", chars:"アイウエオァィゥェォヴ" },
      { key:"カ", chars:"カキクケコガギグゲゴ" },
      { key:"サ", chars:"サシスセソザジズゼゾ" },
      { key:"タ", chars:"タチツテトダヂヅデドッ" },
      { key:"ナ", chars:"ナニヌネノ" },
      { key:"ハ", chars:"ハヒフヘホバビブベボパピプペポ" },
      { key:"マ", chars:"マミムメモ" },
      { key:"ヤ", chars:"ヤユヨャュョ" },
      { key:"ラ", chars:"ラリルレロ" },
      { key:"ワ", chars:"ワヲン" },
    ];
    const rowOf = kana => (ROWS.find(r => r.chars.includes(kana[0])) || {}).key;

    let currentArc = ARCS[0].id;
    let currentRow = "all";

    const arcTabs = document.getElementById("arcTabs");
    const kanaFilter = document.getElementById("kanaFilter");
    const charList = document.getElementById("charList");
    const emptyNote = document.getElementById("emptyNote");

    function renderArcs() {
      arcTabs.innerHTML = "";
      ARCS.forEach(a => {
        const b = document.createElement("button");
        b.className = "arc-btn" + (a.id === currentArc ? " active" : "");
        b.textContent = a.name;
        b.addEventListener("click", () => { currentArc = a.id; currentRow = "all"; renderAll(); });
        arcTabs.appendChild(b);
      });
    }

    function renderKana() {
      kanaFilter.innerHTML = "";
      const others = CHARACTERS.filter(c => c.arc === currentArc && !c.pin);
      const used = new Set(others.map(c => rowOf(c.kana)));
      const items = [{ key:"all", label:"全て" }, ...ROWS.map(r => ({ key:r.key, label:r.key }))];
      items.forEach(it => {
        const b = document.createElement("button");
        b.className = "kana-btn" + (it.key === currentRow ? " active" : "");
        b.textContent = it.label;
        if (it.key !== "all" && !used.has(it.key)) b.disabled = true;
        b.addEventListener("click", () => { currentRow = it.key; renderKana(); applyFilter(); });
        kanaFilter.appendChild(b);
      });
    }

    function renderList() {
      charList.innerHTML = "";
      const inArc = CHARACTERS.filter(c => c.arc === currentArc);
      const pinned = inArc.filter(c => c.pin).sort((a,b) => a.pin - b.pin);
      const others = inArc.filter(c => !c.pin).sort((a,b) => a.kana.localeCompare(b.kana, "ja"));
      [...pinned, ...others].forEach((c, i) => {
        const id = "desc-" + i;
        const li = document.createElement("li");
        li.className = "char-item" + (c.pin && i === pinned.length - 1 ? " pinned-last" : "");
        li.dataset.row = c.pin ? "pin" : rowOf(c.kana);
        li.innerHTML =
          '<button class="char-toggle" aria-expanded="false" aria-controls="' + id + '">' +
            '<span class="char-arrow" aria-hidden="true">→</span>' +
            '<span class="char-name"></span>' +
          '</button>' +
          '<div class="char-body" id="' + id + '"><div><p class="char-desc"></p></div></div>';
        li.querySelector(".char-name").textContent = c.name;
        li.querySelector(".char-desc").textContent = c.desc;
        const btn = li.querySelector(".char-toggle");
        const body = li.querySelector(".char-body");
        btn.addEventListener("click", () => {
          const open = btn.getAttribute("aria-expanded") !== "true";
          btn.setAttribute("aria-expanded", open);
          body.classList.toggle("open", open);
        });
        charList.appendChild(li);
      });
    }

    function applyFilter() {
      let shown = 0;
      charList.querySelectorAll(".char-item").forEach(li => {
        const r = li.dataset.row;
        const visible = r === "pin" || currentRow === "all" || r === currentRow;
        li.hidden = !visible;
        if (visible && r !== "pin") shown++;
      });
      emptyNote.hidden = shown > 0 || currentRow === "all";
    }

    function renderAll() { renderArcs(); renderKana(); renderList(); applyFilter(); }
    renderAll();

    /* ===== 星空 ===== */
    const canvas = document.getElementById("starCanvas");
    const ctx = canvas.getContext("2d");
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize(); window.addEventListener("resize", resize);
    const COLORS = ["#c8d8f0","#c8d8f0","#c8d8f0","#d4a843","#a8b8e0","#c0a8e8"];
    const stars = Array.from({length:220}, () => ({ x:Math.random(), y:Math.random(), r:Math.random()*1.6+0.2, base:Math.random()*0.5+0.2, amp:Math.random()*0.5, speed:Math.random()*0.018+0.004, phase:Math.random()*Math.PI*2, color:COLORS[Math.floor(Math.random()*COLORS.length)] }));
    let t = 0;
    function draw() {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0,0,W,H);
      const bg = ctx.createRadialGradient(W*.5,H*.25,0,W*.5,H*.25,W*.75);
      bg.addColorStop(0,"#060d1a"); bg.addColorStop(.5,"#050810"); bg.addColorStop(1,"#050810");
      ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
      const nb = ctx.createRadialGradient(W*.28,H*.38,0,W*.28,H*.38,W*.42);
      nb.addColorStop(0,"rgba(74,45,107,0.13)"); nb.addColorStop(1,"rgba(74,45,107,0)");
      ctx.fillStyle = nb; ctx.fillRect(0,0,W,H);
      stars.forEach(s => { const tw = (Math.sin(t*s.speed*8+s.phase)+1)/2; ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2); ctx.fillStyle = s.color; ctx.globalAlpha = s.base+tw*s.amp; ctx.fill(); });
      ctx.globalAlpha = 1; t++; requestAnimationFrame(draw);
    }
    draw();

    /* ===== メニュー ===== */
    const menuBtn = document.getElementById("menuBtn");
    const menuOverlay = document.getElementById("menuOverlay");
    function closeMenu() { menuOverlay.classList.remove("open"); menuBtn.classList.remove("open"); menuBtn.setAttribute("aria-label","メニューを開く"); }
    menuBtn.addEventListener("click", () => {
      const isOpen = menuOverlay.classList.toggle("open");
      menuBtn.classList.toggle("open", isOpen);
      menuBtn.setAttribute("aria-label", isOpen ? "メニューを閉じる" : "メニューを開く");
    });
    menuOverlay.querySelectorAll("a").forEach(a => a.addEventListener("click", closeMenu));
    document.getElementById("menuCloseBtn").addEventListener("click", closeMenu);
  </script>
</body>
</html>
