<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHARACTER | 星脈と深淵の狭間で</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#050810; color:#c8d8f0; }
    body { display:flex; flex-direction:column; font-family:"Montserrat",sans-serif; }
    #starCanvas { position:fixed; inset:0; z-index:0; }

    header {
      position:relative; z-index:20;
      display:flex; justify-content:center; align-items:center;
      padding:36px 32px 24px;
    }
    .site-title {
      font-family:"Noto Serif JP",serif; font-weight:200;
      font-size:clamp(20px,4.5vw,42px); letter-spacing:0.22em; text-align:center;
      background:linear-gradient(100deg,#b8ccee 0%,#d4a843 45%,#b8ccee 100%);
      background-size:220% auto;
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      animation:shimmer 8s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position:0% center; }
      100% { background-position:220% center; }
    }
    .back-btn {
      position:absolute; top:40px; left:32px;
      background:none; border:none; cursor:pointer;
      color:#3a4e6e; font-family:"Montserrat",sans-serif;
      font-weight:200; font-size:11px; letter-spacing:0.35em;
      text-decoration:none;
      transition:color 0.3s ease;
    }
    .back-btn:hover { color:#c8d8f0; }
    .back-btn::before { content:"← "; }

    main {
      position:relative; z-index:10;
      flex:1; display:flex; flex-direction:column;
      justify-content:center; align-items:center; gap:24px;
    }
    .page-label {
      font-family:"Montserrat",sans-serif; font-weight:200;
      font-size:clamp(28px,7vw,56px); letter-spacing:0.45em;
      color:#1e2e4a;
    }
    .divider {
      display:flex; align-items:center; gap:12px; width:180px;
    }
    .divider::before, .divider::after {
      content:""; flex:1; height:1px;
      background:linear-gradient(90deg,transparent,rgba(200,216,240,0.18),transparent);
    }
    .divider-star { color:#d4a843; font-size:9px; opacity:0.6; }
    .coming {
      font-family:"Noto Serif JP",serif; font-weight:200;
      font-size:clamp(11px,1.8vw,13px); letter-spacing:0.32em; color:#3a4e6e;
    }

    footer {
      position:relative; z-index:10;
      text-align:center; padding:10px 0 16px;
      font-size:11px; letter-spacing:0.22em; color:#3a4e6e; font-weight:300;
    }
  </style>
</head>
<body>
  <canvas id="starCanvas"></canvas>

  <header>
    <a class="back-btn" href="index.html">TOP</a>
    <h1 class="site-title">星脈と深淵の狭間で</h1>
  </header>

  <main>
    <p class="page-label">CHARACTER</p>
    <div class="divider"><span class="divider-star">✦</span></div>
    <p class="coming">準備中</p>
  </main>

  <footer>@hasuki_kuro</footer>

  <script>
    const canvas = document.getElementById("starCanvas");
    const ctx = canvas.getContext("2d");
    function resize() { canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
    resize();
    window.addEventListener("resize", resize);
    const COLORS=["#c8d8f0","#c8d8f0","#c8d8f0","#d4a843","#a8b8e0","#c0a8e8"];
    const stars=Array.from({length:220},()=>{
      return {
        x:Math.random(), y:Math.random(),
        r:Math.random()*1.6+0.2, base:Math.random()*0.5+0.2,
        amp:Math.random()*0.5, speed:Math.random()*0.018+0.004,
        phase:Math.random()*Math.PI*2,
        color:COLORS[Math.floor(Math.random()*COLORS.length)]
      };
    });
    let t=0;
    function draw(){
      const W=canvas.width, H=canvas.height;
      ctx.clearRect(0,0,W,H);
      const bg=ctx.createRadialGradient(W*.5,H*.25,0,W*.5,H*.25,W*.75);
      bg.addColorStop(0,"#0e1c38"); bg.addColorStop(.6,"#080f20"); bg.addColorStop(1,"#050810");
      ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
      const nb=ctx.createRadialGradient(W*.28,H*.38,0,W*.28,H*.38,W*.42);
      nb.addColorStop(0,"rgba(74,45,107,0.13)"); nb.addColorStop(1,"rgba(74,45,107,0)");
      ctx.fillStyle=nb; ctx.fillRect(0,0,W,H);
      stars.forEach(s=>{
        const tw=(Math.sin(t*s.speed*8+s.phase)+1)/2;
        ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
        ctx.fillStyle=s.color; ctx.globalAlpha=s.base+tw*s.amp; ctx.fill();
      });
      ctx.globalAlpha=1; t++; requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
