<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAP | 星脈と深淵の狭間で</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#050810; color:#c8d8f0; }
    body { display:flex; flex-direction:column; font-family:"Montserrat",sans-serif; }
    #starCanvas { position:fixed; inset:0; z-index:0; }

    header {
      position:relative; z-index:20;
      display:flex; justify-content:center; align-items:center;
      padding:28px 32px 14px;
    }
    .site-title {
      font-family:"Noto Serif JP",serif; font-weight:200;
      font-size:clamp(18px,3.6vw,34px); letter-spacing:0.22em; text-align:center;
      background:linear-gradient(100deg,#b8ccee 0%,#d4a843 45%,#b8ccee 100%);
      background-size:220% auto;
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      animation:shimmer 8s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position:0% center; }
      100% { background-position:220% center; }
    }
    .back-btn {
      position:absolute; top:32px; left:32px;
      background:none; border:none; cursor:pointer;
      color:#3a4e6e; font-family:"Montserrat",sans-serif;
      font-weight:200; font-size:11px; letter-spacing:0.35em;
      text-decoration:none;
      transition:color 0.3s ease;
    }
    .back-btn:hover { color:#c8d8f0; }
    .back-btn::before { content:"← "; }

    main {
      position:relative; z-index:10;
      flex:1; min-height:0;
      display:flex; flex-direction:column;
      justify-content:center; align-items:center; gap:10px;
      padding:0 16px;
    }
    .page-label {
      font-family:"Montserrat",sans-serif; font-weight:200;
      font-size:clamp(18px,3.6vw,26px); letter-spacing:0.4em;
      color:#1e2e4a;
    }
    .divider {
      display:flex; align-items:center; gap:12px; width:160px;
    }
    .divider::before, .divider::after {
      content:""; flex:1; height:1px;
      background:linear-gradient(90deg,transparent,rgba(200,216,240,0.18),transparent);
    }
    .divider-star { color:#d4a843; font-size:9px; opacity:0.6; }

    /* ===== Map frame ===== */
    .map-frame {
      position:relative;
      width:min(88vw, calc(68vh * 1324 / 1188));
      aspect-ratio:1324 / 1188;
      max-height:68vh;
      margin-top:4px;
      border-radius:3px;
      box-shadow:0 0 0 1px rgba(212,168,67,0.25), 0 18px 50px rgba(0,0,0,0.55);
      overflow:hidden;
    }
    .map-frame img {
      display:block; width:100%; height:100%;
      object-fit:fill;
      -webkit-user-drag:none;
      user-select:none;
    }
    .map-overlay {
      position:absolute; inset:0;
      width:100%; height:100%;
      pointer-events:none;
    }

    /* ===== Location pins ===== */
    .map-pin {
      position:absolute;
      transform:translate(-50%,-50%);
      display:flex; flex-direction:column; align-items:center;
      gap:3px;
      pointer-events:none;
    }
    .map-pin .dot {
      width:8px; height:8px; border-radius:50%;
      background:#d4a843;
      border:1.3px solid #2a1c0e;
      box-shadow:0 0 5px rgba(212,168,67,0.7);
    }
    .map-pin .label {
      font-family:"Noto Serif JP",serif; font-weight:500;
      font-size:clamp(10px,1.3vw,13px);
      letter-spacing:0.06em;
      color:#2a1c0e;
      background:rgba(241,231,206,0.62);
      padding:1px 7px;
      border-radius:2px;
      white-space:nowrap;
    }
    /* keep castle label to the side so it doesn't sit over the artwork */
    .map-pin.--right { align-items:flex-start; }
    .map-pin.--right .label { margin-left:2px; }

    /* ===== Compass rose ===== */
    .compass {
      position:absolute; right:4%; bottom:4%;
      width:11%; max-width:64px; min-width:34px;
      opacity:0.8;
    }

    footer {
      position:relative; z-index:10;
      text-align:center; padding:8px 0 12px;
      font-size:11px; letter-spacing:0.22em; color:#3a4e6e; font-weight:300;
    }
  </style>
</head>
<body>
  <canvas id="starCanvas"></canvas>

  <header>
    <a class="back-btn" href="index.html">TOP</a>
    <h1 class="site-title">星脈と深淵の狭間で</h1>
  </header>

  <main>
    <p class="page-label">MAP</p>
    <div class="divider"><span class="divider-star">✦</span></div>

    <div class="map-frame">
      <img src="map-art.png" alt="星脈と深淵の狭間で 古地図（東海〜関東）">

      <div class="map-overlay">

        <!-- 拠点ピン：座標は .map-frame に対する % 指定。
             位置を調整する場合は left / top の値だけ変更すればOK -->

        <!-- ヒスミ村 -->
        <div class="map-pin" style="left:15.5%; top:63.5%;">
          <span class="dot"></span>
          <span class="label">ヒスミ村</span>
        </div>

        <!-- アレシス -->
        <div class="map-pin --right" style="left:29.5%; top:75.3%;">
          <span class="dot"></span>
          <span class="label">アレシス</span>
        </div>

        <!-- コンパスローズ -->
        <svg class="compass" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#3b2a18" stroke-width="1.4"/>
          <circle cx="50" cy="50" r="38" fill="none" stroke="#3b2a18" stroke-width="0.7"/>
          <path d="M50 6 L57 50 L50 94 L43 50 Z" fill="#3b2a18" opacity="0.85"/>
          <path d="M6 50 L50 57 L94 50 L50 43 Z" fill="#3b2a18" opacity="0.55"/>
          <circle cx="50" cy="50" r="3" fill="#3b2a18"/>
          <text x="50" y="18" text-anchor="middle" font-family="Noto Serif JP, serif" font-size="11" fill="#3b2a18">北</text>
        </svg>

      </div>
    </div>
  </main>

  <footer>@hasuki_kuro</footer>

  <script>
    const canvas = document.getElementById("starCanvas");
    const ctx = canvas.getContext("2d");
    function resize() { canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
    resize();
    window.addEventListener("resize", resize);
    const COLORS=["#c8d8f0","#c8d8f0","#c8d8f0","#d4a843","#a8b8e0","#c0a8e8"];
    const stars=Array.from({length:220},()=>{
      return {
        x:Math.random(), y:Math.random(),
        r:Math.random()*1.6+0.2, base:Math.random()*0.5+0.2,
        amp:Math.random()*0.5, speed:Math.random()*0.018+0.004,
        phase:Math.random()*Math.PI*2,
        color:COLORS[Math.floor(Math.random()*COLORS.length)]
      };
    });
    let t=0;
    function draw(){
      const W=canvas.width, H=canvas.height;
      ctx.clearRect(0,0,W,H);
      const bg=ctx.createRadialGradient(W*.5,H*.25,0,W*.5,H*.25,W*.75);
      bg.addColorStop(0,"#0e1c38"); bg.addColorStop(.6,"#080f20"); bg.addColorStop(1,"#050810");
      ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
      const nb=ctx.createRadialGradient(W*.28,H*.38,0,W*.28,H*.38,W*.42);
      nb.addColorStop(0,"rgba(74,45,107,0.13)"); nb.addColorStop(1,"rgba(74,45,107,0)");
      ctx.fillStyle=nb; ctx.fillRect(0,0,W,H);
      stars.forEach(s=>{
        const tw=(Math.sin(t*s.speed*8+s.phase)+1)/2;
        ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
        ctx.fillStyle=s.color; ctx.globalAlpha=s.base+tw*s.amp; ctx.fill();
      });
      ctx.globalAlpha=1; t++; requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
